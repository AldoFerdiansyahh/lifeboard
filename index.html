<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#435c4f">
  <meta name="description" content="Personal life management app for tasks, schedules, notes and finance.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/interactions.css">
  <link rel="stylesheet" href="css/brand.css">
  <title>LIFEBOARD — Your personal command center.</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Navigasi utama">
      <a class="brand" href="#/dashboard" aria-label="LIFEBOARD home"><img class="brand-logo" src="assets/image/logo.png" alt=""><span>LIFEBOARD</span></a>
      <nav id="desktop-nav"></nav>
      <div class="sidebar-foot"><button class="nav-link" data-route="settings"><span>⚙</span> Settings</button><button class="nav-link" data-route="backup"><span>⇅</span> Backup</button></div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <div><p class="eyebrow" id="page-eyebrow">Personal command center</p><h1 id="page-title">Home</h1></div>
        <div class="top-actions">
          <span id="connection-badge" class="status-badge" role="status">ONLINE</span>
          <button id="search-button" class="icon-button" aria-label="Global search" title="Search (Ctrl/⌘ K)"></button>
          <button id="theme-button" class="icon-button" aria-label="Switch theme"></button>
          <button id="profile-button" class="profile-button" aria-label="Edit profile"><img id="profile-avatar" src="assets/image/aldo.png" alt=""></button>
        </div>
      </header>
      <div id="offline-banner" class="offline-banner" hidden>Offline mode — your data is safe on this device.</div>
      <main id="main-content" tabindex="-1"><div class="loading-state"><span class="spinner"></span><p>Preparing LIFEBOARD…</p></div></main>
    </div>
    <nav id="mobile-nav" class="bottom-nav" aria-label="Navigasi mobile"></nav>
  </div>
  <div id="modal-root"></div><div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input id="backup-file" type="file" accept="application/json,.json" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
